rules:
  - id: no-insecure-deserialization
    patterns:
      - pattern-either:
          - pattern: new BinaryFormatter()
          - pattern: new JavaScriptSerializer()
          - pattern: $SERIALIZER.TypeNameHandling = TypeNameHandling.Auto
          - pattern: $SERIALIZER.TypeNameHandling = TypeNameHandling.All
          - pattern: |
              var $SETTINGS = new JsonSerializerSettings
              {
                ...,
                TypeNameHandling = TypeNameHandling.Auto,
                ...
              };
          - pattern: |
              var $SETTINGS = new JsonSerializerSettings
              {
                ...,
                TypeNameHandling = TypeNameHandling.All,
                ...
              };
    message: >
      Insecure deserialization detected. BinaryFormatter, JavaScriptSerializer, and
      TypeNameHandling.Auto/All are vulnerable to remote code execution (RCE) attacks.
      Use System.Text.Json (default settings) or Newtonsoft.Json with TypeNameHandling.None.
    severity: ERROR
    languages:
      - csharp
