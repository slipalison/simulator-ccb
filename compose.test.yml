# Override for CI DAST testing — lightweight stack (API + PostgreSQL only, no Keycloak/observability)
# The API liveness check (/healthz/live) does not depend on external services,
# so ZAP can scan headers, error responses, and surface vulnerabilities.

services:
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/Onboarding.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__AppDb: Host=test_db;Port=5432;Database=test;Username=test;Password=test
      Keycloak__AuthServerUrl: http://localhost:8180
      Keycloak__Authority: http://localhost:8180/realms/onboarding
      Keycloak__AdminClientId: ""
      Keycloak__AdminClientSecret: ""
      Keycloak__RealmUrl: http://localhost:8180/realms/onboarding
      Keycloak__ValidIssuer: http://localhost:8180/realms/onboarding
    ports:
      - "8080:8080"
    depends_on:
      test_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
