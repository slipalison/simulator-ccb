name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build
        run: dotnet build Onboarding.slnx --no-restore --configuration Release

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Test - Domain
        env:
          CI: true
        run: >
          dotnet test tests/Onboarding.Domain.Tests/Onboarding.Domain.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/domain.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.Infrastructure]*,[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Test - API
        env:
          CI: true
        run: >
          dotnet test tests/Onboarding.API.Tests/Onboarding.API.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/api.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.Infrastructure]*,[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Test - Integration
        env:
          CI: true
          TESTCONTAINERS_CONNECT_TIMEOUT: "120"
        run: >
          dotnet test tests/Onboarding.Integration.Tests/Onboarding.Integration.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/integration.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.Infrastructure]*,[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge coverage/*.cobertura.xml -o coverage/merged.cobertura.xml -f cobertura

      - name: Validate coverage threshold (80%)
        run: |
          RESULT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage/merged.cobertura.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0))
          branch_rate = float(root.get('branch-rate', 0))
          lines_covered = int(root.get('lines-covered', 0))
          lines_valid = int(root.get('lines-valid', 0))
          branches_covered = int(root.get('branches-covered', 0))
          branches_valid = int(root.get('branches-valid', 0))
          print(f'{line_rate * 100:.2f}')
          print(f'{branch_rate * 100:.2f}')
          print(f'{lines_covered}')
          print(f'{lines_valid}')
          print(f'{branches_covered}')
          print(f'{branches_valid}')

          # Per-package breakdown
          for pkg in root.findall('.//package'):
              name = pkg.get('name', 'unknown')
              lr = float(pkg.get('line-rate', 0)) * 100
              br = float(pkg.get('branch-rate', 0)) * 100
              print(f'PKG|{name}|{lr:.1f}|{br:.1f}')
          ")

          LINE_COV=$(echo "$RESULT" | sed -n '1p')
          BRANCH_COV=$(echo "$RESULT" | sed -n '2p')
          LINES_HIT=$(echo "$RESULT" | sed -n '3p')
          LINES_TOTAL=$(echo "$RESULT" | sed -n '4p')
          BRANCHES_HIT=$(echo "$RESULT" | sed -n '5p')
          BRANCHES_TOTAL=$(echo "$RESULT" | sed -n '6p')

          echo "Combined line coverage: ${LINE_COV}%"
          echo "Combined branch coverage: ${BRANCH_COV}%"

          # Write coverage summary to GitHub Actions Job Summary
          {
            echo "## Code Coverage Report"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Line Coverage** | **${LINE_COV}%** |"
            echo "| **Branch Coverage** | ${BRANCH_COV}% |"
            echo "| Lines Covered | ${LINES_HIT} / ${LINES_TOTAL} |"
            echo "| Branches Covered | ${BRANCHES_HIT} / ${BRANCHES_TOTAL} |"
            echo ""
            echo "### Per-Module Breakdown"
            echo ""
            echo "| Module | Line % | Branch % |"
            echo "|--------|--------|----------|"
            echo "$RESULT" | grep '^PKG|' | while IFS='|' read -r _ name line branch; do
              echo "| ${name} | ${line}% | ${branch}% |"
            done
            echo ""
            if (( $(echo "$LINE_COV < 80" | bc -l) )); then
              echo "> **Status:** :x: Coverage ${LINE_COV}% is below 80% threshold"
            else
              echo "> **Status:** :white_check_mark: Coverage ${LINE_COV}% meets 80% threshold"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( $(echo "$LINE_COV < 80" | bc -l) )); then
            echo "::error::Coverage ${LINE_COV}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage ${LINE_COV}% meets 80% threshold"

  frontend-client:
    name: Frontend Client (Vinxi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-client-${{ hashFiles('frontend/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-client-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

  frontend-backoffice:
    name: Frontend Backoffice (Vinxi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/backoffice
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backoffice-${{ hashFiles('frontend/backoffice/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backoffice-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep/ \
            --output semgrep.sarif \
            --sarif \
            --error

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql

  sca-trivy:
    name: SCA — Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  container-scan-trivy:
    name: Container Scan — Trivy Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: onboarding-api:ci
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  container-lint-dockle:
    name: Container Lint — Dockle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Install Dockle
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/goodwithtech/dockle/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -sL "https://github.com/goodwithtech/dockle/releases/download/v${VERSION}/dockle_${VERSION}_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin dockle

      - name: Run Dockle scan
        run: dockle --exit-code 1 --exit-level error --timeout 5m onboarding-api:ci

  iac-checkov:
    name: IaC — Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov IaC scan
        run: |
          checkov \
            --file compose.yaml \
            --framework dockerfile_compose \
            --check CKV_DOCKER_*,CKV2_DOCKER_* \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  secrets-gitleaks:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          report-path: gitleaks-report.json
          verbose: true

  secrets-trufflehog:
    name: Secrets — TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"TruffleHog","informationUri":"https://github.com/trufflesecurity/trufflehog","rules":[]}},"results":[]}]}' > results.sarif
          fi

      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: trufflehog
