rules:
  - id: no-hardcoded-credentials
    patterns:
      - pattern-either:
          # Connection strings with passwords
          - pattern-regex: (?i)(?:Server|Data Source|Initial Catalog|Host|Database)\s*=\s*[^;]+;\s*(?:Password|Pwd)\s*=\s*[^;]+
          # API key patterns
          - pattern-regex: (?:sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|xoxb-[a-zA-Z0-9\-]+|AKIA[0-9A-Z]{16})
          # Hardcoded secrets in C# code (not in configuration reads)
          - pattern-either:
              - pattern: $VAR = "sk-..."
              - pattern: $VAR = "ghp_..."
              - pattern: $VAR = "AKIA..."
    message: >
      Hardcoded credentials detected. Use environment variables, Azure Key Vault,
      or IConfiguration to manage secrets securely. Never commit credentials to source control.
    severity: ERROR
    languages:
      - csharp
