rules:
  - id: no-localstorage-tokens
    patterns:
      - pattern: localStorage.setItem("$KEY", ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: ".*(?:[Tt]oken|[Ss]ession|[Aa]uth|[Jj]wt|[Bb]earer|[Ss]ecret).*"
    message: >
      Storing authentication tokens in localStorage is vulnerable to XSS attacks.
      Use httpOnly cookies or in-memory storage instead.
    severity: ERROR
    languages:
      - typescript
      - javascript
