name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:

  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Build — Parallel builds for backend + both frontends
  # ─────────────────────────────────────────────────────────────────

  backend-build:
    name: "Backend › Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build (Release)
        run: dotnet build Onboarding.slnx --no-restore --configuration Release

  frontend-client-build:
    name: "Frontend Client › Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-client-${{ hashFiles('frontend/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-client-

      - name: Install dependencies
        run: npm ci

      - name: Build production
        env:
          NODE_ENV: production
        run: npm run build

  frontend-backoffice-build:
    name: "Frontend Backoffice › Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/backoffice
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backoffice-${{ hashFiles('frontend/backoffice/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backoffice-

      - name: Install dependencies
        run: npm ci

      - name: Build production
        env:
          NODE_ENV: production
        run: npm run build

# ─────────────────────────────────────────────────────────────────
# Stage 2: Tests — Depends on build artifacts, runs test checks
# ─────────────────────────────────────────────────────────────────

  backend-tests:
    name: "Backend › Tests"
    runs-on: ubuntu-latest
    needs: backend-build
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build (Release)
        run: dotnet build Onboarding.slnx --no-restore --configuration Release

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Test - Domain
        env:
          CI: true
        run: >
          dotnet test tests/Onboarding.Domain.Tests/Onboarding.Domain.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/domain.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.Infrastructure]*,[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Test - API
        env:
          CI: true
        run: >
          dotnet test tests/Onboarding.API.Tests/Onboarding.API.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/api.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.Infrastructure]*,[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Test - Integration
        env:
          CI: true
          TESTCONTAINERS_CONNECT_TIMEOUT: "120"
        run: >
          dotnet test tests/Onboarding.Integration.Tests/Onboarding.Integration.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/integration.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.Infrastructure]*,[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge coverage/*.cobertura.xml -o coverage/merged.cobertura.xml -f cobertura

      - name: Validate coverage threshold (80%)
        run: |
          RESULT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage/merged.cobertura.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0))
          branch_rate = float(root.get('branch-rate', 0))
          lines_covered = int(root.get('lines-covered', 0))
          lines_valid = int(root.get('lines-valid', 0))
          branches_covered = int(root.get('branches-covered', 0))
          branches_valid = int(root.get('branches-valid', 0))
          print(f'{line_rate * 100:.2f}')
          print(f'{branch_rate * 100:.2f}')
          print(f'{lines_covered}')
          print(f'{lines_valid}')
          print(f'{branches_covered}')
          print(f'{branches_valid}')

          # Per-package breakdown
          for pkg in root.findall('.//package'):
              name = pkg.get('name', 'unknown')
              lr = float(pkg.get('line-rate', 0)) * 100
              br = float(pkg.get('branch-rate', 0)) * 100
              print(f'PKG|{name}|{lr:.1f}|{br:.1f}')
          ")

          LINE_COV=$(echo "$RESULT" | sed -n '1p')
          BRANCH_COV=$(echo "$RESULT" | sed -n '2p')
          LINES_HIT=$(echo "$RESULT" | sed -n '3p')
          LINES_TOTAL=$(echo "$RESULT" | sed -n '4p')
          BRANCHES_HIT=$(echo "$RESULT" | sed -n '5p')
          BRANCHES_TOTAL=$(echo "$RESULT" | sed -n '6p')

          echo "Combined line coverage: ${LINE_COV}%"
          echo "Combined branch coverage: ${BRANCH_COV}%"

          # Write coverage summary to GitHub Actions Job Summary
          {
            echo "## Code Coverage Report"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Line Coverage** | **${LINE_COV}%** |"
            echo "| **Branch Coverage** | ${BRANCH_COV}% |"
            echo "| Lines Covered | ${LINES_HIT} / ${LINES_TOTAL} |"
            echo "| Branches Covered | ${BRANCHES_HIT} / ${BRANCHES_TOTAL} |"
            echo ""
            echo "### Per-Module Breakdown"
            echo ""
            echo "| Module | Line % | Branch % |"
            echo "|--------|--------|----------|"
            echo "$RESULT" | grep '^PKG|' | while IFS='|' read -r _ name line branch; do
              echo "| ${name} | ${line}% | ${branch}% |"
            done
            echo ""
            if (( $(echo "$LINE_COV < 80" | bc -l) )); then
              echo "> **Status:** :x: Coverage ${LINE_COV}% is below 80% threshold"
            else
              echo "> **Status:** :white_check_mark: Coverage ${LINE_COV}% meets 80% threshold"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( $(echo "$LINE_COV < 80" | bc -l) )); then
            echo "::error::Coverage ${LINE_COV}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage ${LINE_COV}% meets 80% threshold"

  frontend-client-tests:
    name: "Frontend Client › Tests"
    runs-on: ubuntu-latest
    needs: frontend-client-build
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-client-${{ hashFiles('frontend/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-client-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

  frontend-backoffice-tests:
    name: "Frontend Backoffice › Tests"
    runs-on: ubuntu-latest
    needs: frontend-backoffice-build
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/backoffice
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backoffice-${{ hashFiles('frontend/backoffice/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-backoffice-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

# ─────────────────────────────────────────────────────────────────
# Stage 3: Security — All jobs independent, run in parallel
# ─────────────────────────────────────────────────────────────────

  security-sast-semgrep:
    name: "Security › SAST — Semgrep"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep/ \
            --output semgrep.sarif \
            --sarif \
            --error

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  security-sast-codeql:
    name: "Security › SAST — CodeQL"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql

  security-sca-trivy:
    name: "Security › SCA — Trivy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  security-container-trivy:
    name: "Security › Container — Trivy Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: onboarding-api:ci
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  security-container-dockle:
    name: "Security › Container — Dockle"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Install Dockle
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/goodwithtech/dockle/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -sL "https://github.com/goodwithtech/dockle/releases/download/v${VERSION}/dockle_${VERSION}_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin dockle

      - name: Run Dockle scan
        run: dockle --exit-code 1 --exit-level error --timeout 5m onboarding-api:ci

  security-iac-checkov:
    name: "Security › IaC — Checkov"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov IaC scan
        run: |
          checkov \
            --file compose.yaml \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  security-secrets-gitleaks:
    name: "Security › Secrets — Gitleaks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          report-path: gitleaks-report.json
          verbose: true

  security-secrets-trufflehog:
    name: "Security › Secrets — TruffleHog"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"TruffleHog","informationUri":"https://github.com/trufflesecurity/trufflehog","rules":[]}},"results":[]}]}' > results.sarif
          fi

      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: trufflehog

  security-sbom-syft:
    name: "Security › SBOM — Syft"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM (source code)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          dependency-snapshot: true

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Generate SBOM (backend image)
        uses: anchore/sbom-action@v0
        with:
          image: onboarding-api:ci
          format: cyclonedx-json
          output-file: sbom-image.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sboms
          path: |
            sbom-source.spdx.json
            sbom-image.cyclonedx.json
          retention-days: 30

  security-dast-zap:
    name: "Security › DAST — OWASP ZAP Baseline"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build API (Release)
        run: dotnet build src/Onboarding.API/Onboarding.API.csproj --no-restore --configuration Release

      - name: Start API in background
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_HTTP_PORTS: "8080"
          ConnectionStrings__AppDb: Host=localhost;Port=5432;Database=test;Username=test;Password=test
          Keycloak__AuthServerUrl: http://localhost:8180
          Keycloak__Authority: http://localhost:8180/realms/onboarding
          Keycloak__AdminClientId: ""
          Keycloak__AdminClientSecret: ""
          Keycloak__RealmUrl: http://localhost:8180/realms/onboarding
          Keycloak__ValidIssuer: http://localhost:8180/realms/onboarding
        run: |
          dotnet run --project src/Onboarding.API/Onboarding.API.csproj --no-build --configuration Release --urls "http://0.0.0.0:8080" &
          echo "Waiting for API health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz/live > /dev/null 2>&1; then
              echo "API is healthy after ${i} attempts"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "::error::API did not become healthy"
          curl -v http://localhost:8080/healthz/live || true
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          fail_action: false
          cmd_options: "-a"
          rules_file_name: ".zap-rules.tsv"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap_report.json
            report_json.json
            report_html.html
          retention-days: 30
          continue-on-error: true
