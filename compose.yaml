services:
  app_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - app_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kcuser
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcuser -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: kcuser
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: http://localhost:8180
      KC_SPI_LOGIN_PROTOCOL__OPENID_CONNECT__REQUEST_URI_ENABLED: "false"
    volumes:
      - ./keycloak/onboarding-realm.json:/opt/keycloak/data/import/onboarding-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9000:9000"   # Keycloak management port (health endpoints)
    depends_on:
      keycloak_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: src/Onboarding.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__AppDb: Host=app_db;Port=5432;Database=onboarding;Username=appuser;Password=${APP_DB_PASSWORD}
      Keycloak__AuthServerUrl: http://keycloak:8080
      Keycloak__Authority: http://keycloak:8080/realms/onboarding
      Keycloak__AdminClientId: onboarding-api-admin
      Keycloak__AdminClientSecret: ${KC_ADMIN_CLIENT_SECRET}
      Keycloak__RealmUrl: http://keycloak:8080/realms/onboarding
      Keycloak__ValidIssuer: http://localhost:8180/realms/onboarding
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: onboarding-api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app_db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend-client:
    build:
      context: ./frontend/client
      dockerfile: Dockerfile
    volumes:
      - ./frontend/client/src:/app/src
      - ./frontend/client/public:/app/public
      - ./frontend/client/server.ts:/app/server.ts
      - ./frontend/client/app.config.ts:/app/app.config.ts
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:8180
      VITE_KEYCLOAK_REALM: onboarding
      VITE_KEYCLOAK_CLIENT_ID: onboarding-app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

  frontend-backoffice:
    build:
      context: ./frontend/backoffice
      dockerfile: Dockerfile
    volumes:
      - ./frontend/backoffice/src:/app/src
      - ./frontend/backoffice/public:/app/public
      - ./frontend/backoffice/server.ts:/app/server.ts
      - ./frontend/backoffice/app.config.ts:/app/app.config.ts
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:8180
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      api:
        condition: service_healthy

  # ── Observability Stack (Phase 4) ─────────────────────────────────────────

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"   # Alloy UI (optional, useful for debugging)
      - "127.0.0.1:4317:4317"     # OTLP gRPC (exposed for direct testing outside compose)
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12345/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  loki:
    image: grafana/loki:3
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tempo:
    image: grafana/tempo:2.7.2
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP API (Grafana datasource)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mimir:
    image: grafana/mimir:latest
    volumes:
      - ./infra/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data
    command: ["--config.file=/etc/mimir/mimir.yaml", "-target=all"]
    ports:
      - "127.0.0.1:9009:9009"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9009/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3000:3000"   # D-09: Grafana UI
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_data:
  keycloak_data:
  loki_data:
  tempo_data:
  mimir_data:
  grafana_data:

networks:
  default:
    name: onboarding-net
