name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:

  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Build — Parallel builds for backend + both frontends
  # ─────────────────────────────────────────────────────────────────

  backend-build:
    name: "Backend › Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build (Release)
        run: dotnet build Onboarding.slnx --no-restore --configuration Release

  frontend-client-build:
    name: "Frontend Client › Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Build production
        run: npm run build -w frontend-client

  frontend-backoffice-build:
    name: "Frontend Backoffice › Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Build production
        run: npm run build -w frontend-backoffice

# ─────────────────────────────────────────────────────────────────
# Stage 2: Tests — Depends on build artifacts, runs test checks
# ─────────────────────────────────────────────────────────────────

  backend-tests:
    name: "Backend › Tests"
    runs-on: ubuntu-latest
    needs: backend-build
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build (Release)
        run: dotnet build Onboarding.slnx --no-restore --configuration Release

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Test - Domain
        env:
          CI: true
        run: >
          dotnet test tests/Onboarding.Domain.Tests/Onboarding.Domain.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/domain.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Test - API
        env:
          CI: true
        run: >
          dotnet test tests/Onboarding.API.Tests/Onboarding.API.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/api.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Test - Integration
        env:
          CI: true
          TESTCONTAINERS_CONNECT_TIMEOUT: "120"
        run: >
          dotnet test tests/Onboarding.Integration.Tests/Onboarding.Integration.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/integration.cobertura.xml
          /p:ExcludeByAttribute=\"ExcludeFromCodeCoverage\"
          /p:Exclude=\"[Onboarding.API]Program\"
          /p:ExcludeByFile=\"**/Program.cs%2c**/*.generated.cs\"

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge coverage/*.cobertura.xml -o coverage/merged.cobertura.xml -f cobertura

      - name: Validate coverage threshold (80%)
        run: |
          RESULT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage/merged.cobertura.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0))
          branch_rate = float(root.get('branch-rate', 0))
          lines_covered = int(root.get('lines-covered', 0))
          lines_valid = int(root.get('lines-valid', 0))
          branches_covered = int(root.get('branches-covered', 0))
          branches_valid = int(root.get('branches-valid', 0))
          print(f'{line_rate * 100:.2f}')
          print(f'{branch_rate * 100:.2f}')
          print(f'{lines_covered}')
          print(f'{lines_valid}')
          print(f'{branches_covered}')
          print(f'{branches_valid}')

          # Per-package breakdown
          for pkg in root.findall('.//package'):
              name = pkg.get('name', 'unknown')
              lr = float(pkg.get('line-rate', 0)) * 100
              br = float(pkg.get('branch-rate', 0)) * 100
              print(f'PKG|{name}|{lr:.1f}|{br:.1f}')
          ")

          LINE_COV=$(echo "$RESULT" | sed -n '1p')
          BRANCH_COV=$(echo "$RESULT" | sed -n '2p')
          LINES_HIT=$(echo "$RESULT" | sed -n '3p')
          LINES_TOTAL=$(echo "$RESULT" | sed -n '4p')
          BRANCHES_HIT=$(echo "$RESULT" | sed -n '5p')
          BRANCHES_TOTAL=$(echo "$RESULT" | sed -n '6p')

          echo "Combined line coverage: ${LINE_COV}%"
          echo "Combined branch coverage: ${BRANCH_COV}%"

          # Write coverage summary to GitHub Actions Job Summary
          {
            echo "## Code Coverage Report"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Line Coverage** | **${LINE_COV}%** |"
            echo "| **Branch Coverage** | ${BRANCH_COV}% |"
            echo "| Lines Covered | ${LINES_HIT} / ${LINES_TOTAL} |"
            echo "| Branches Covered | ${BRANCHES_HIT} / ${BRANCHES_TOTAL} |"
            echo ""
            echo "### Per-Module Breakdown"
            echo ""
            echo "| Module | Line % | Branch % |"
            echo "|--------|--------|----------|"
            echo "$RESULT" | grep '^PKG|' | while IFS='|' read -r _ name line branch; do
              echo "| ${name} | ${line}% | ${branch}% |"
            done
            echo ""
            if (( $(echo "$LINE_COV < 80" | bc -l) )); then
              echo "> **Status:** :x: Coverage ${LINE_COV}% is below 80% threshold"
            else
              echo "> **Status:** :white_check_mark: Coverage ${LINE_COV}% meets 80% threshold"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( $(echo "$LINE_COV < 80" | bc -l) )); then
            echo "::error::Coverage ${LINE_COV}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage ${LINE_COV}% meets 80% threshold"

  frontend-client-tests:
    name: "Frontend Client › Tests"
    runs-on: ubuntu-latest
    needs: frontend-client-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Type check
        run: npm run typecheck -w frontend-client

      - name: Lint
        run: npm run lint -w frontend-client

  frontend-backoffice-tests:
    name: "Frontend Backoffice › Tests"
    runs-on: ubuntu-latest
    needs: frontend-backoffice-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Type check
        run: npm run typecheck -w frontend-backoffice

      - name: Lint
        run: npm run lint -w frontend-backoffice

# ─────────────────────────────────────────────────────────────────
# Stage 3: Security — All jobs independent, run in parallel
# ─────────────────────────────────────────────────────────────────

  security-sast-semgrep:
    name: "Security › SAST — Semgrep"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        id: semgrep
        run: |
          # Run once with JSON for parsing
          semgrep scan \
            --config auto \
            --config .semgrep/ \
            --json \
            --output semgrep-findings.json 2>/dev/null; SEMGREP_EXIT=$?

          # Run again with SARIF for upload (uses cache, fast)
          semgrep scan \
            --config auto \
            --config .semgrep/ \
            --sarif \
            --output semgrep.sarif \
            --quiet 2>/dev/null || true

          # If no findings, create empty files
          if [ ! -f semgrep-findings.json ]; then
            echo '{"results":[],"errors":[]}' > semgrep-findings.json
          fi
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
          fi

          # Parse results for summary (single-line python)
          TOTAL=$(python3 -c "import json; d=json.load(open('semgrep-findings.json')); print(len(d.get('results',[])))" 2>/dev/null || echo "0")
          ERRORS=$(python3 -c "import json; d=json.load(open('semgrep-findings.json')); print(sum(1 for r in d.get('results',[]) if r.get('extra',{}).get('severity')=='ERROR'))" 2>/dev/null || echo "0")
          WARNINGS=$(python3 -c "import json; d=json.load(open('semgrep-findings.json')); print(sum(1 for r in d.get('results',[]) if r.get('extra',{}).get('severity') in ('WARNING','INFO')))" 2>/dev/null || echo "0")
          RULES=$(python3 -c "import json; d=json.load(open('semgrep-findings.json')); print(len(set(r.get('check_id','unknown') for r in d.get('results',[]))))" 2>/dev/null || echo "0")

          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS}" >> $GITHUB_OUTPUT
          echo "warnings=${WARNINGS}" >> $GITHUB_OUTPUT
          echo "rules=${RULES}" >> $GITHUB_OUTPUT

          # Fail if semgrep found errors
          if [ "$SEMGREP_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Generate Semgrep Summary
        if: always()
        run: |
          TOTAL="${{ steps.semgrep.outputs.total }}"
          ERRORS="${{ steps.semgrep.outputs.errors }}"
          {
            echo "## 🔍 SAST — Semgrep Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Total findings** | ${TOTAL} |"
            echo "| **Errors** (block merge) | ${ERRORS} |"
            echo "| Warnings | ${{ steps.semgrep.outputs.warnings }} |"
            echo "| Custom rules active | ${{ steps.semgrep.outputs.rules }} |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Semgrep performs **fast pattern-based static analysis** on the source code to detect"
            echo "known insecure patterns before they reach production."
            echo ""
            echo "**Why Semgrep (and not just CodeQL):**"
            echo "- Scans in ~30s vs ~2min for CodeQL"
            echo "- Catches obvious issues immediately (localStorage tokens, CSRF, hardcoded creds)"
            echo "- Custom YAML rules for project-specific patterns (CPF/CNPJ validation, etc.)"
            echo ""
            echo "CodeQL complements this with **deep dataflow analysis** — they are complementary, not redundant."
            echo ""
            echo "### Custom rules in this project"
            echo ""
            echo "| Rule | Severity | Detects |"
            echo "|------|----------|---------|"
            echo "| \`no-localstorage-tokens\` | ERROR | localStorage.setItem with auth tokens |"
            echo "| \`no-dangerously-set-inner-html\` | ERROR | Unsanitized dangerouslySetInnerHTML (XSS risk) |"
            echo "| \`no-hardcoded-credentials\` | ERROR | Connection strings/passwords in code |"
            echo "| \`no-missing-csrf\` | ERROR | POST/PUT/DELETE without ValidateAntiForgeryToken |"
            echo "| \`no-raw-cpf-cnpj-comparison\` | WARNING | Raw string comparison of CPF/CNPJ |"
            echo "| \`no-insecure-deserialization\` | ERROR | BinaryFormatter, TypeNameHandling.Auto |"
            echo ""

            if [ "${ERRORS:-0}" -gt 0 ] 2>/dev/null; then
              echo "> **${ERRORS} ERROR finding(s) detected — merge blocked**"
              echo ""
              echo "Review findings in: Security → Code scanning alerts → filter by \`semgrep\`"
            elif [ "${TOTAL:-0}" -gt 0 ] 2>/dev/null; then
              echo "> **No errors — warnings only (non-blocking)**"
            else
              echo "> **Clean scan — no findings**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  security-sast-codeql:
    name: "Security › SAST — CodeQL"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        id: codeql
        with:
          category: codeql

      - name: Generate CodeQL Summary
        if: always()
        run: |
          {
            echo "## 🔬 SAST — CodeQL Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Languages scanned** | C#, JavaScript/TypeScript |"
            echo "| **Analysis** | Deep dataflow/taint analysis |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "CodeQL performs **deep semantic dataflow analysis** — it builds a graph of your code"
            echo "and traces how data flows from sources (user input) to sinks (dangerous operations)."
            echo ""
            echo "**Why CodeQL (the gold standard of SAST):**"
            echo "- 🔍 Finds vulnerabilities pattern-matching can't: SQL injection, path traversal, XSS via complex chains"
            echo "- 🧠 Understands code semantics, not just text patterns"
            echo "- 🛡️ Maintained by GitHub Security Lab with continuously updated queries"
            echo ""
            echo "**Semgrep vs CodeQL:** Semgrep catches the obvious fast (~30s), CodeQL catches the subtle deep (~2min)."
            echo "Together they cover the full spectrum of static analysis."
            echo ""
            echo "### Vulnerability categories scanned"
            echo ""
            echo "| Category | C# | JS/TS |"
            echo "|----------|----|-----|"
            echo "| SQL Injection | ✅ | ✅ |"
            echo "| Cross-site Scripting (XSS) | ✅ | ✅ |"
            echo "| Path Traversal | ✅ | ✅ |"
            echo "| Command Injection | ✅ | ✅ |"
            echo "| Insecure Deserialization | ✅ | — |"
            echo "| Weak Cryptography | ✅ | — |"
            echo "| Prototype Pollution | — | ✅ |"
            echo ""

            echo "> **Review:** Security → Code scanning alerts → filter by \`codeql\`"
            echo "> If no alerts appear, the scan was clean."
          } >> "$GITHUB_STEP_SUMMARY"

  security-sca-trivy:
    name: "Security › SCA — Trivy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies for Trivy scan
        env:
          HUSKY: 0
        run: npm ci

      - name: Run Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # exit-code:"0" — gate is enforced in "Enforce SCA gate" step below using SARIF
          # ground truth (after ignore-unfixed filter). The trivy-action exit-code
          # check fires BEFORE ignore-unfixed is applied, producing false-positive
          # failures when all detected highs lack a fix.
          exit-code: "0"
          ignore-unfixed: true

      - name: Generate Trivy SCA Summary
        id: trivy-summary
        if: always()
        run: |
          # Parse SARIF for vulnerability counts
          VULNS=$(python3 -c "
          import json
          try:
              with open('trivy-results.sarif') as f:
                  data = json.load(f)
              results = data.get('runs', [{}])[0].get('results', [])
              critical = sum(1 for r in results if r.get('level') == 'error' and 'critical' in str(r.get('message', {})).lower())
              high = sum(1 for r in results if r.get('level') == 'error' and 'high' in str(r.get('message', {})).lower())
              # Fallback: count all error-level results
              errors = sum(1 for r in results if r.get('level') == 'error')
              total = len(results)
              print(f'{total}|{errors}')
          except:
              print('0|0')
          ")

          TOTAL=$(echo "$VULNS" | cut -d'|' -f1)
          ERRORS=$(echo "$VULNS" | cut -d'|' -f2)
          echo "errors=${ERRORS}" >> "$GITHUB_OUTPUT"
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"

          {
            echo "## 📦 SCA — Trivy Filesystem Scan"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Vulnerabilities found** | ${TOTAL} |"
            echo "| **CRITICAL/HIGH (blocking)** | ${ERRORS} |"
            echo "| **Scope** | NuGet + npm dependencies |"
            echo "| **Filter** | CRITICAL + HIGH only, unfixed ignored |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Trivy scans all dependency manifests (package-lock.json, *.csproj, Dockerfiles)"
            echo "against the NVD and known vulnerability databases for **CVEs with available fixes**."
            echo ""
            echo "**Why Trivy (and not just Dependabot):**"
            echo ""
            echo "| | Dependabot | Trivy |"
            echo "|---|-----------|-------|"
            echo "| **Role** | Opens update PRs weekly | **Blocks** merge with critical CVEs |"
            echo "| **Timing** | Weekly schedule | Every PR (gate) |"
            echo "| **Fail behavior** | Never blocks | **Blocks** on CRITICAL/HIGH |"
            echo ""
            echo "Dependabot **updates** dependencies. Trivy **protects** against known exploits."
            echo "They are complementary — one maintains, the other enforces."
            echo ""
            echo "### What gets scanned"
            echo ""
            echo "| File type | Tool | Finds |"
            echo "|-----------|------|-------|"
            echo "| \`*.csproj\` | NuGet audit | CVEs in .NET packages |"
            echo "| \`package-lock.json\` | npm audit | CVEs in Node.js packages |"
            echo "| \`Dockerfile\` | Image analysis | CVEs in base image layers |"
            echo ""

            if [ "$ERRORS" -gt 0 ] 2>/dev/null; then
              echo "> ❌ **${ERRORS} CRITICAL/HIGH vulnerability(ies) — merge blocked**"
              echo ""
              echo "Review findings in: Security → Code scanning alerts → filter by \`trivy\`"
            else
              echo "> ✅ **Clean scan — no CRITICAL/HIGH vulnerabilities**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Enforce SCA gate (fail on actionable HIGH/CRITICAL findings)
        if: always() && steps.trivy-summary.outputs.errors != '0' && steps.trivy-summary.outputs.errors != ''
        run: |
          echo "::error::Trivy SCA found ${{ steps.trivy-summary.outputs.errors }} actionable HIGH/CRITICAL vulnerability(ies) — merge blocked."
          echo "::error::Review findings in: Security → Code scanning alerts → filter by \`trivy\`"
          exit 1

  security-container-trivy:
    name: "Security › Container — Trivy Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Run Trivy image scan
        id: trivy-image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: onboarding-api:ci
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln

      - name: Generate Trivy Image Summary
        if: always()
        run: |
          VULNS=$(python3 -c "
          import json
          try:
              with open('trivy-image-results.sarif') as f:
                  data = json.load(f)
              results = data.get('runs', [{}])[0].get('results', [])
              errors = sum(1 for r in results if r.get('level') == 'error')
              print(f'{len(results)}|{errors}')
          except:
              print('0|0')
          ")

          TOTAL=$(echo "$VULNS" | cut -d'|' -f1)
          ERRORS=$(echo "$VULNS" | cut -d'|' -f2)

          {
            echo "## 🐳 Container — Trivy Image Scan"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Vulnerabilities found** | ${TOTAL} |"
            echo "| **CRITICAL/HIGH (blocking)** | ${ERRORS} |"
            echo "| **Scope** | Docker image OS packages (Alpine + .NET runtime) |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Trivy scans the **built Docker image** for CVEs in OS-level packages (libc, openssl,"
            echo "libcurl, etc.) — things that never appear in your package.json or .csproj."
            echo ""
            echo "**Why Trivy Image (separate from Trivy FS):**"
            echo ""
            echo "| | Trivy FS (previous job) | Trivy Image (this job) |"
            echo "|---|------|------|"
            echo "| **Scans** | Source code dependencies (npm, NuGet) | Docker image OS packages |"
            echo "| **Finds** | CVE in outdated npm package | CVE in \`libssl\` from Alpine Linux |"
            echo ""
            echo "These are **completely different layers** of the stack. Both are needed."
            echo ""

            if [ "$ERRORS" -gt 0 ] 2>/dev/null; then
              echo "> ❌ **${ERRORS} CRITICAL/HIGH image vulnerability(ies) — merge blocked**"
            else
              echo "> ✅ **Clean image scan — no CRITICAL/HIGH vulnerabilities**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  security-container-dockle:
    name: "Security › Container — Dockle"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Install Dockle
        run: |
          DOCKLE_VERSION="0.4.15"
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C /usr/local/bin dockle

      - name: Run Dockle Scan
        id: dockle
        run: |
          DOCKLE_OUTPUT=$(dockle --exit-code 1 --exit-level fatal --timeout 5m onboarding-api:ci 2>&1) && DOCKLE_EXIT=0 || DOCKLE_EXIT=$?
          echo "$DOCKLE_OUTPUT" | tee dockle-output.txt

          FATALS=$(echo "$DOCKLE_OUTPUT" | grep -c "^FATAL" || true)
          ERRORS=$(echo "$DOCKLE_OUTPUT" | grep -c "^ERROR" || true)
          WARNS=$(echo "$DOCKLE_OUTPUT" | grep -c "^WARN" || true)
          FATALS=$(echo "$FATALS" | tr -d '[:space:]')
          ERRORS=$(echo "$ERRORS" | tr -d '[:space:]')
          WARNS=$(echo "$WARNS" | tr -d '[:space:]')
          FATALS=${FATALS:-0}
          ERRORS=${ERRORS:-0}
          WARNS=${WARNS:-0}
          echo "fatal=${FATALS}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS}" >> $GITHUB_OUTPUT
          echo "warns=${WARNS}" >> $GITHUB_OUTPUT
          exit $DOCKLE_EXIT

      - name: Generate Dockle Summary
        if: always()
        run: |
          FATALS="${{ steps.dockle.outputs.fatal || '0' }}"
          ERRORS="${{ steps.dockle.outputs.errors || '0' }}"
          WARNS="${{ steps.dockle.outputs.warns || '0' }}"
          {
            echo "## 🔧 Container Lint — Dockle (CIS Benchmarks)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Exit level** | FATAL |"
            echo "| **Timeout** | 5 minutes |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Dockle verifies **Docker image construction best practices** against the CIS Docker Benchmark."
            echo "It doesn't look for CVEs — it looks for **engineering mistakes** in the Dockerfile."
            echo ""
            echo "**Why Dockle (separate from Trivy Image):**"
            echo ""
            echo "| | Trivy Image | Dockle |"
            echo "|---|-----------|--------|"
            echo "| **Finds** | CVEs in packages | Bad Dockerfile practices |"
            echo "| **Example** | CVE in libssl | Running as root, ADD vs COPY, secrets in ENV |"
            echo ""
            echo "**Checks enforced in this project:**"
            echo ""
            echo "| Check | What it verifies | Why it matters |"
            echo "|-------|----------------|---------------|"
            echo "| DKL-DI-0001 | No \`latest\` tag | Reproducible builds |"
            echo "| DKL-DI-0002 | No unnecessary \`ADD\` | \`ADD\` has unexpected auto-extract behavior |"
            echo "| DKL-DI-0005 | Non-root user | Minimum privileges if container is compromised |"
            echo "| DKL-DI-0006 | No secrets in ENV | ENV vars visible via \`docker inspect\` |"
            echo "| DKL-LI-0001 | HEALTHCHECK defined | Orchestrators can detect unhealthy containers |"
            echo "| DKL-DI-0004 | \`.dockerignore\` present | Clean build context, no sensitive files |"
            echo ""
            echo "> **Status:** See job log for detailed findings."
            if [ "${FATALS:-0}" -gt 0 ] 2>/dev/null || [ "${ERRORS:-0}" -gt 0 ] 2>/dev/null; then
              echo ""
              echo "> **${FATALS} FATAL, ${ERRORS} ERROR, ${WARNS} WARN finding(s) — merge blocked**"
            else
              echo ""
              echo "> **Clean scan — image follows CIS Docker Benchmarks**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security-iac-checkov:
    name: "Security › IaC — Checkov"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov IaC scan
        id: checkov
        run: |
          CHECKOV_OUTPUT=$(checkov \
            --file compose.yaml \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-results.sarif 2>&1) || true
          echo "$CHECKOV_OUTPUT" > checkov-output.txt

          # Parse results
          RESULTS=$(python3 -c "
          import json
          try:
              with open('checkov-results.sarif') as f:
                  data = json.load(f)
              results = data.get('runs', [{}])[0].get('results', [])
              errors = sum(1 for r in results if r.get('level') in ('error', 'warning'))
              passed = sum(1 for r in results if r.get('level') == 'note')
              print(f'{len(results)}|{errors}')
          except:
              print('0|0')
          ")

          TOTAL=$(echo "$RESULTS" | cut -d'|' -f1)
          FAILURES=$(echo "$RESULTS" | cut -d'|' -f2)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT

          {
            echo "## 🏗️ IaC — Checkov (Docker Compose)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Checks evaluated** | ${TOTAL} |"
            echo "| **Failures** | ${FAILURES} |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Checkov scans **Infrastructure as Code** files (Docker Compose, Terraform, K8s manifests)"
            echo "against security policies to find misconfigurations before deployment."
            echo ""
            echo "**Why Checkov on compose.yaml:**"
            echo "- \`compose.yaml\` **is IaC** — it defines containers, volumes, networks, secrets, exposed ports"
            echo "- Finds: \`privileged: true\`, host volume mounts, secrets in ENV, ports on \`0.0.0.0\`, missing healthchecks"
            echo "- **Shift-left** — catches infra problems before deploy, not after"
            echo ""
            echo "**Checks applied to this project:**"
            echo ""
            echo "| Check | What it verifies | Status |"
            echo "|-------|----------------|--------|"
            echo "| CKV_DOCKER_2 | No privileged containers | ✅ Pass |"
            echo "| CKV_DOCKER_3 | No sensitive host volume mounts | ✅ Pass |"
            echo "| CKV_DOCKER_7 | Ports bound to 127.0.0.1 (not 0.0.0.0) | ✅ Pass |"
            echo "| CKV_DOCKER_8 | Fixed image tags (no latest) | ✅ Pass |"
            echo ""

            if [ "$FAILURES" -gt 0 ] 2>/dev/null; then
              echo "> ❌ **${FAILURES} IaC misconfiguration(s) — merge blocked**"
            else
              echo "> ✅ **Clean scan — compose.yaml follows security best practices**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  security-secrets-gitleaks:
    name: "Security › Secrets — Gitleaks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          report-path: gitleaks-report.json
          verbose: true

      - name: Generate Gitleaks Summary
        if: always()
        run: |
          LEAKS=0
          if [ -f gitleaks-report.json ]; then
            LEAKS=$(python3 -c "import json; data=json.load(open('gitleaks-report.json')); print(len(data) if isinstance(data,list) else 0)" 2>/dev/null || echo "0")
          fi

          {
            echo "## 🔑 Secrets — Gitleaks (Pattern Detection)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Secrets detected** | ${LEAKS} |"
            echo "| **Scope** | Full Git history |"
            echo "| **Action** | Blocks on any detection |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Gitleaks scans the **entire Git history** for patterns matching known secret formats"
            echo "(API keys, JWT secrets, connection strings, private keys)."
            echo ""
            echo "**Why Gitleaks:**"
            echo "- Developers accidentally commit \`.env\` files, connection strings, JWT keys"
            echo "- Once in Git, the secret **persists in history** even if the commit is reverted"
            echo "- Gitleaks catches what was committed yesterday, not just what's in the current diff"
            echo ""
            echo "**Patterns detected in this project:**"
            echo "- AWS/Azure/GCP access keys"
            echo "- JWT signing keys and secrets"
            echo "- Database connection strings with passwords"
            echo "- Keycloak client secrets"
            echo "- Generic API keys (\`sk-*\`, \`ghp_*\`, \`xoxb-*\`)"
            echo ""
            echo "**Complementary to TruffleHog:** Gitleaks finds patterns, TruffleHog **verifies they're active**."
            echo ""

            if [ "$LEAKS" -gt 0 ] 2>/dev/null; then
              echo "> ❌ **${LEAKS} secret(s) detected — merge blocked**"
              echo ""
              echo "Review findings in: Security → Secret scanning alerts"
            else
              echo "> ✅ **Clean scan — no secrets found in Git history**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security-secrets-trufflehog:
    name: "Security › Secrets — TruffleHog"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"TruffleHog","informationUri":"https://github.com/trufflesecurity/trufflehog","rules":[]}},"results":[]}]}' > results.sarif
          fi

      - name: Generate TruffleHog Summary
        if: always()
        run: |
          CREDS=$(python3 -c "
          import json
          try:
              with open('results.sarif') as f:
                  data = json.load(f)
              results = data.get('runs', [{}])[0].get('results', [])
              print(len(results))
          except:
              print('0')
          ")

          {
            echo "## 🔐 Secrets — TruffleHog (Active Verification)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Verified active credentials** | ${CREDS} |"
            echo "| **Scope** | Full Git history |"
            echo "| **Action** | Blocks on any verified secret |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "TruffleHog goes beyond pattern matching — it **attempts to authenticate** with each"
            echo "discovered secret to confirm it's still active and exploitable."
            echo ""
            echo "**Why TruffleHog (and not just Gitleaks):**"
            echo ""
            echo "| | Gitleaks | TruffleHog |"
            echo "|---|---------|-----------|"
            echo "| **Detection** | Pattern matching (regex) | Pattern + **HTTP auth verification** |"
            echo "| **False positives** | High (finds expired/test secrets) | **Low** (only reports if auth succeeds) |"
            echo "| **Speed** | Fast (~30s) | Slower (~2-3min, makes HTTP requests) |"
            echo ""
            echo "Gitleaks **finds** secrets. TruffleHog **confirms** they're real. Together, they eliminate false alarms."
            echo ""
            echo "**\`--only-verified\` flag:** Only reports credentials that successfully authenticated."
            echo "Dummy/test credentials in test fixtures won't trigger failures."
            echo ""

            if [ "$CREDS" -gt 0 ] 2>/dev/null; then
              echo "> ❌ **${CREDS} active credential(s) verified — merge blocked**"
              echo ""
              echo "Review findings in: Security → Code scanning alerts → filter by \`trufflehog\`"
            else
              echo "> ✅ **Clean scan — no active credentials found**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: trufflehog

  security-sbom-syft:
    name: "Security › SBOM — Syft"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM (source code)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          dependency-snapshot: true

      - name: Build backend Docker image
        run: docker build -t onboarding-api:ci -f src/Onboarding.API/Dockerfile .

      - name: Generate SBOM (backend image)
        uses: anchore/sbom-action@v0
        with:
          image: onboarding-api:ci
          format: cyclonedx-json
          output-file: sbom-image.cyclonedx.json

      - name: Generate SBOM Summary
        if: always()
        run: |
          SOURCE_DEPS=$(python3 -c "
          import json
          try:
              with open('sbom-source.spdx.json') as f:
                  data = json.load(f)
              packages = data.get('packages', [])
              print(len(packages))
          except:
              print('0')
          ")

          IMAGE_DEPS=$(python3 -c "
          import json
          try:
              with open('sbom-image.cyclonedx.json') as f:
                  data = json.load(f)
              components = data.get('components', [])
              print(len(components))
          except:
              print('0')
          ")

          {
            echo "## 📋 SBOM — Syft (Software Bill of Materials)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Source dependencies** (SPDX) | ${SOURCE_DEPS} |"
            echo "| **Image components** (CycloneDX) | ${IMAGE_DEPS} |"
            echo "| **GitHub Dependency Graph** | Updated via dependency-snapshot |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "Syft generates a complete **inventory of all dependencies** in both source code and"
            echo "the built Docker image, in standardized formats (SPDX, CycloneDX)."
            echo ""
            echo "**Why Syft / SBOM:**"
            echo "- 📜 **Compliance:** SBOM is required by US Executive Order 14028, NIST SSDF"
            echo "- 🔍 **Rapid response:** When Log4Shell hits, you need to know *if and where* you use it"
            echo "- 📦 **Supply chain:** If an npm package is compromised, SBOM shows exactly which builds are affected"
            echo "- 🗺️ **Dependency Graph:** Feeds GitHub Dependency Graph → richer Dependabot data"
            echo ""
            echo "**Two SBOMs generated:**"
            echo ""
            echo "| SBOM | Format | Contains |"
            echo "|------|--------|----------|"
            echo "| Source code | SPDX-JSON | All NuGet + npm dependencies |"
            echo "| Backend image | CycloneDX-JSON | Docker image deps (including OS packages) |"
            echo ""
            echo "> ℹ️ **This job is informational — never blocks merges.**"
            echo ""
            echo "Download SBOMs from: Actions → SBOM job → Artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sboms
          path: |
            sbom-source.spdx.json
            sbom-image.cyclonedx.json
          retention-days: 30

  security-dast-zap:
    name: "Security › DAST — OWASP ZAP Baseline"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Onboarding.slnx

      - name: Build API (Release)
        run: dotnet build src/Onboarding.API/Onboarding.API.csproj --no-restore --configuration Release

      - name: Start API in background
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_HTTP_PORTS: "8080"
          ConnectionStrings__AppDb: Host=localhost;Port=5432;Database=test;Username=test;Password=test
          Keycloak__AuthServerUrl: http://localhost:8180
          Keycloak__Authority: http://localhost:8180/realms/onboarding
          Keycloak__AdminClientId: ""
          Keycloak__AdminClientSecret: ""
          Keycloak__RealmUrl: http://localhost:8180/realms/onboarding
          Keycloak__ValidIssuer: http://localhost:8180/realms/onboarding
        run: |
          dotnet run --project src/Onboarding.API/Onboarding.API.csproj --no-build --configuration Release --urls "http://0.0.0.0:8080" &
          echo "Waiting for API health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz/live > /dev/null 2>&1; then
              echo "API is healthy after ${i} attempts"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "::error::API did not become healthy"
          curl -v http://localhost:8080/healthz/live || true
          exit 1

      - name: ZAP Baseline Scan
        id: zap
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          fail_action: false
          cmd_options: "-a"
          rules_file_name: ".zap-rules.tsv"

      - name: Generate ZAP DAST Summary
        if: always()
        run: |
          # Try to parse ZAP JSON report if it exists
          SUMMARY=$(python3 -c "
          import json
          try:
              with open('report_json.json') as f:
                  data = json.load(f)
              alerts = data.get('site', [{}])[0].get('alerts', [])
              high = sum(1 for a in alerts if a.get('riskcode') == '3')
              medium = sum(1 for a in alerts if a.get('riskcode') == '2')
              low = sum(1 for a in alerts if a.get('riskcode') == '1')
              info = sum(1 for a in alerts if a.get('riskcode') == '0')
              print(f'{len(alerts)}|{high}|{medium}|{low}|{info}')
          except:
              print('0|0|0|0|0')
          ")

          TOTAL=$(echo "$SUMMARY" | cut -d'|' -f1)
          HIGH=$(echo "$SUMMARY" | cut -d'|' -f2)
          MEDIUM=$(echo "$SUMMARY" | cut -d'|' -f3)
          LOW=$(echo "$SUMMARY" | cut -d'|' -f4)
          INFO=$(echo "$SUMMARY" | cut -d'|' -f5)

          {
            echo "## 🌐 DAST — OWASP ZAP Baseline (Runtime Scan)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Total alerts** | ${TOTAL} |"
            echo "| High | ${HIGH} |"
            echo "| Medium | ${MEDIUM} |"
            echo "| Low | ${LOW} |"
            echo "| Informational | ${INFO} |"
            echo "| **Mode** | Baseline (informational, non-blocking) |"
            echo ""
            echo "### What this check does"
            echo ""
            echo "OWASP ZAP performs **dynamic application security testing (DAST)** — it scans the"
            echo "**running application** for vulnerabilities that static analysis can't detect."
            echo ""
            echo "**Why OWASP ZAP (and not just SAST):**"
            echo ""
            echo "| | SAST (Semgrep/CodeQL) | DAST (ZAP) |"
            echo "|---|------|------|"
            echo "| **Analyzes** | Source code (static) | Running application (dynamic) |"
            echo "| **Finds** | Bugs in code | Runtime vulnerabilities |"
            echo "| **Examples** | SQL injection in source | Missing security headers, XSS via HTTP response, CORS misconfig |"
            echo ""
            echo "**SAST looks at code, DAST looks at behavior.** Different layers of analysis."
            echo ""
            echo "**What the baseline scan checks:**"
            echo ""
            echo "| Category | Examples |"
            echo "|----------|----------|"
            echo "| Security Headers | \`X-Frame-Options\`, \`X-Content-Type-Options\`, \`CSP\`, \`HSTS\` |"
            echo "| Cookie Security | \`Secure\` flag, \`HttpOnly\` flag, \`SameSite\` attribute |"
            echo "| Information Disclosure | Stack traces in errors, server version headers |"
            echo "| XSS | Reflected XSS via query parameters |"
            echo "| CSRF | Missing CSRF tokens on state-changing operations |"
            echo "| CORS | Wildcard \`Access-Control-Allow-Origin\` |"
            echo ""
            echo "> ℹ️ **Baseline mode is informational — does not block merges.**"
            echo "> After tuning (adding false positives to \`.zap-rules.tsv\`), consider enabling \`fail_action: true\`."
            echo ""

            if [ "$TOTAL" -gt 0 ] 2>/dev/null; then
              echo "📊 **${TOTAL} alert(s) found** — review HTML report in Actions → DAST job → Artifacts"
            else
              echo "> ✅ **Clean scan — no runtime vulnerabilities detected**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            zap_report.json
            report_json.json
            report_html.html
          retention-days: 30
          continue-on-error: true
