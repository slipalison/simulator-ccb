rules:
  - id: no-raw-cpf-cnpj-comparison
    patterns:
      - pattern-regex: ==\s*['"]\d{11,14}['"]|['"]\d{11,14}['"]\s*==
    message: >
      Raw CPF/CNPJ string comparison detected. Use domain Value Objects (Cpf, Cnpj)
      for identity document handling. Raw comparisons are error-prone and bypass
      validation logic.
    severity: WARNING
    languages:
      - csharp
